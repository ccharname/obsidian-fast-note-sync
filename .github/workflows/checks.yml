name: Plugin checks

on:
  push:
    branches: [lucky]
  pull_request:
    branches: [lucky]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published release tag to verify without modifying it
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; packageManager pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify
      - name: Verify published release assets
        if: env.RELEASE_TAG != ''
        run: node scripts/release-check.cjs --release "$RELEASE_TAG" --asset-dir dist/plugin
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-note-sync-verified
          path: dist/
          if-no-files-found: error
          retention-days: 14
